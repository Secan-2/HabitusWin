name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 标签与 Info.plist 必须一致，否则包里版本和 Release 对不上
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          plist=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          echo "tag=$tag plist=$plist"
          [ "$tag" = "$plist" ] || { echo "版本不一致：标签 $tag，Info.plist $plist"; exit 1; }

      - name: Build app
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee ci-run.log

      - name: Package DMG
        run: |
          set -o pipefail
          ./Tools/make-dmg.sh 2>&1 | tee -a ci-run.log

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.dmg --title "HabitusWin ${GITHUB_REF_NAME}" --generate-notes

      # 未登录看不到 Actions 日志，失败时把编译日志推到 ci-log 分支，便于直接读取
      - name: Report build log
        if: failure()
        run: |
          mkdir -p .ci
          cp build.log .ci/build.log 2>/dev/null || echo "no build.log" > .ci/build.log
          cp ci-run.log .ci/ci-run.log 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f .ci/build.log .ci/ci-run.log
          git commit -m "ci: build log $(date -u +%FT%TZ)" || true
          git push -f origin HEAD:ci-log
