name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 标签与 Info.plist 必须一致，否则包里版本和 Release 对不上
      - name: Check version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          plist=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          echo "tag=$tag plist=$plist"
          [ "$tag" = "$plist" ] || { echo "版本不一致：标签 $tag，Info.plist $plist"; exit 1; }

      - name: Build app
        run: ./build.sh

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.dmg --title "HabitusWin ${GITHUB_REF_NAME}" --generate-notes
