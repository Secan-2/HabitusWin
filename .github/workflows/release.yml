name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: ./build.sh

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Show artifact
        run: ls -lh dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.dmg --title "HabitusWin ${GITHUB_REF_NAME}" --generate-notes
